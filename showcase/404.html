<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Little Lemon</title>
    <script type="text/javascript">
      // Root 404 handler for the Little Lemon showcase site.
      // - /little-lemon-project/app/*  -> SPA redirect into the React app
      // - anything else               -> back to the showcase home
      (function () {
        var l = window.location;
        var base = "/little-lemon-project";
        var appBase = base + "/app";
        if (l.pathname.indexOf(appBase + "/") === 0) {
          // Single Page Apps for GitHub Pages (rafgraph/spa-github-pages),
          // adapted: 2 path segments to keep (little-lemon-project, app)
          var pathSegmentsToKeep = 2;
          l.replace(
            l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") +
            l.pathname.split("/").slice(0, 1 + pathSegmentsToKeep).join("/") + "/?/" +
            l.pathname.slice(1).split("/").slice(pathSegmentsToKeep).join("/").replace(/&/g, "~and~") +
            (l.search ? "&" + l.search.slice(1).replace(/&/g, "~and~") : "") +
            l.hash
          );
        } else {
          l.replace(l.protocol + "//" + l.hostname + (l.port ? ":" + l.port : "") + base + "/");
        }
      })();
    </script>
  </head>
  <body></body>
</html>
